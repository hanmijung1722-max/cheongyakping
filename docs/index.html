<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2461f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="청약핑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>청약핑</title>
<style>
:root{
  --primary:#2461f5; --urgent:#f55c33; --success:#1aa36e; --violet:#7d57ed; --teal:#14a3a3; --orange:#f59a1f;
  --bg:#f2f2f7; --card:#ffffff; --text:#111114; --sub:#6c6c74; --fill:#e9e9ee; --line:#dcdce2;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --sub:#98989f; --fill:#2c2c2e; --line:#38383a; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;}
header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px}
header p{margin:2px 0 0;font-size:12px;color:var(--sub)}
main{padding:4px 16px 24px;max-width:640px;margin:0 auto}
section{margin-top:22px}
h2{font-size:20px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{font-size:12px;font-weight:700;color:var(--sub);background:var(--fill);border-radius:99px;padding:2px 8px}
.chips{display:flex;gap:8px;margin:6px 0 4px}
.chip{border:0;background:var(--fill);color:var(--text);font-size:14px;font-weight:600;padding:8px 16px;border-radius:99px}
.chip.on{background:var(--primary);color:#fff}
.chips.who{margin:2px 0 6px;align-items:center}
.chips.who .lbl{font-size:12px;font-weight:700;color:var(--sub);margin-right:2px}
.chips.who .chip{font-size:13px;padding:7px 13px}
.chips.who .chip.on{background:var(--violet)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tag2{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;color:var(--violet);background:color-mix(in srgb,var(--violet) 13%,transparent)}
.tag2.gray{color:var(--sub);background:var(--fill)}
.sub-h{font-size:13px;font-weight:700;color:var(--sub);margin:18px 0 8px}
.fit{background:color-mix(in srgb,var(--violet) 10%,transparent);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.6}
.fit b{display:block;margin-bottom:2px}
.fit.no{background:var(--fill)}
.tbl{overflow-x:auto;margin:8px 0}
.tbl table{border-collapse:collapse;font-size:12.5px;width:100%;min-width:420px}
.tbl th,.tbl td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--sub);font-weight:600}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl td.z{color:var(--sub)}
.tag2.ok{color:var(--success);background:color-mix(in srgb,var(--success) 13%,transparent)}
.tag2.warn{color:#c77a00;background:color-mix(in srgb,var(--orange) 18%,transparent)}
.tag2.bad{color:var(--urgent);background:color-mix(in srgb,var(--urgent) 12%,transparent)}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin:8px 0 4px}
.seg button{flex:1;border:0;background:none;color:var(--sub);font-weight:700;font-size:14px;padding:8px 0;border-radius:10px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.form{background:var(--card);border-radius:20px;padding:6px 16px;margin-top:12px}
.form label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.form label:last-child{border-bottom:0}
.form small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px}
.form input,.form select{font:inherit;font-size:16px;color:var(--text);background:var(--fill);border:0;border-radius:10px;padding:8px 10px;text-align:right}
.form input[type=number]{width:64px}
.form .pair{display:flex;align-items:center;gap:6px;font-weight:400;font-size:14px}
.score{background:linear-gradient(135deg,var(--violet),var(--primary));color:#fff;border-radius:22px;padding:18px;margin-top:14px}
.score .big{font-size:44px;font-weight:800;letter-spacing:-1px}
.score .big small{font-size:16px;font-weight:600;opacity:.8}
.score .bars{margin-top:10px;display:grid;gap:8px}
.score .bar{font-size:12px}
.score .bar i{display:block;height:7px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:4px;overflow:hidden}
.score .bar i b{display:block;height:100%;background:#fff;border-radius:99px}
.score p{margin:10px 0 0;font-size:13px;line-height:1.5;opacity:.95}
.card2{background:var(--card);border-radius:20px;padding:16px;margin-top:12px;font-size:14px;line-height:1.65}
.card2 h3{margin:0 0 6px;font-size:16px}
.card2 ul{margin:6px 0 0;padding-left:18px;color:var(--text)}
.card2 li{margin:4px 0}
.card2 .sub{color:var(--sub);font-size:12.5px}
.tbl2{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tbl2 th,.tbl2 td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.tbl2 th{color:var(--sub);font-weight:600}
.tbl2 td:first-child,.tbl2 th:first-child{text-align:left}
.go{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:700;margin-top:12px;background:var(--primary);color:#fff}
.go.soft{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{background:var(--card);border-radius:16px;padding:14px 6px;text-align:center}
.tile b{display:block;font-size:28px;font-weight:800}
.tile span{font-size:12px;color:var(--sub)}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;cursor:pointer}
.card:active{opacity:.85}
.row{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.r-서울{color:var(--primary);background:color-mix(in srgb,var(--primary) 13%,transparent)}
.r-경기{color:var(--success);background:color-mix(in srgb,var(--success) 13%,transparent)}
.badge{font-size:14px;font-weight:800;color:#fff;padding:6px 12px;border-radius:99px;background:var(--primary)}
.badge.open{background:var(--success)} .badge.urgent{background:var(--urgent)}
.badge.wait{background:var(--violet)} .badge.done{background:#8e8e93}
.card h3{margin:12px 0 2px;font-size:17px}
.addr{margin:0;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head{margin:8px 0 10px;font-size:14px;font-weight:700}
.head.open{color:var(--success)} .head.urgent{color:var(--urgent)} .head.upcoming{color:var(--primary)} .head.wait{color:var(--violet)}
.mini{display:flex;background:color-mix(in srgb,var(--fill) 70%,transparent);border-radius:12px;padding:12px}
.mini div{flex:1;min-width:0}
.mini small{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
.mini i{width:6px;height:6px;border-radius:50%;display:inline-block}
.mini b{font-size:15px}
.mini b.past{color:var(--sub);font-weight:600}
.foot{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--sub)}
.added{color:var(--primary);font-weight:700}
.banner{display:flex;gap:10px;border-radius:14px;padding:12px;font-size:13px;margin-top:10px;line-height:1.45}
.banner.violet{background:color-mix(in srgb,var(--violet) 12%,transparent)}
.banner.blue{background:color-mix(in srgb,var(--primary) 11%,transparent)}
.empty{text-align:center;color:var(--sub);padding:56px 0;font-size:14px}
.note{font-size:12px;color:var(--sub);margin-top:18px;line-height:1.5}
/* 캘린더 */
.cal{background:var(--card);border-radius:20px;padding:14px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:18px}
.calhead button{border:0;background:var(--fill);color:var(--text);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.grid .w{font-size:12px;font-weight:600;color:var(--sub);padding:4px 0}
.grid .w:first-child{color:var(--urgent)} .grid .w:nth-child(7){color:var(--primary)}
.day{height:52px;border:0;background:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:4px;font-size:15px}
.day span{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.day.today span{box-shadow:inset 0 0 0 1.5px var(--primary);color:var(--primary);font-weight:700}
.day.sel span{background:var(--primary);color:#fff;font-weight:700;box-shadow:none}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--sub)}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.item{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.ico{width:40px;height:40px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.item b{font-size:15px;display:block;margin:2px 0}
.item small{color:var(--sub);font-size:12px}
/* 가이드 */
.step{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.step .n{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--primary) 13%,transparent);color:var(--primary);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.step b{font-size:15px} .step p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.hero{background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff;border-radius:20px;padding:20px;margin-top:10px}
.hero h2{margin:0 0 4px;font-size:22px} .hero p{margin:0;opacity:.88;font-size:14px}
.box{background:var(--card);border-radius:18px;padding:6px 16px}
.box li{margin:10px 0;font-size:14px;list-style:none}
details{border-bottom:1px solid var(--line);padding:12px 0}
details:last-child{border-bottom:0}
summary{font-weight:600;font-size:14px;cursor:pointer}
details p{margin:8px 0 0;color:var(--sub);font-size:13px;line-height:1.55}
/* 하단 탭 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:9px 0 8px;font-size:11px;font-weight:600}
nav button svg{display:block;margin:0 auto 3px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--primary)}
/* 상세 시트 */
.sheet{position:fixed;inset:0;z-index:10;display:none}
.sheet.open{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);
  border-radius:24px 24px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet .close{float:right;border:0;background:var(--fill);color:var(--text);width:32px;height:32px;border-radius:50%;font-size:16px}
.panel h2{font-size:22px;margin:10px 0 4px}
.tl{background:var(--card);border-radius:20px;padding:16px;margin-top:14px}
.ev{display:flex;gap:14px}
.ev .rail{display:flex;flex-direction:column;align-items:center}
.ev .dot{width:28px;height:28px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.ev .line{width:2px;flex:1;background:var(--line);margin:2px 0}
.ev .txt{padding-bottom:16px}
.ev .txt b{font-size:15px}
.ev .txt .d{font-weight:700;font-size:14px;margin-top:2px}
.ev .txt p{margin:3px 0 0;font-size:12px;color:var(--sub)}
.tag{background:var(--urgent);color:#fff;font-size:10px;padding:2px 6px;border-radius:99px;margin-left:6px;font-weight:700}
.info{background:var(--card);border-radius:20px;padding:16px;margin-top:14px;font-size:14px}
.info div{display:flex;gap:10px;margin:8px 0}
.info span{color:var(--sub);width:76px;flex:none}
.btn{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:15px;padding:15px;border-radius:14px;margin-top:10px;border:0;width:100%}
.btn.primary{background:var(--primary);color:#fff}
.btn.soft{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.btn.gray{background:var(--fill);color:var(--text)}
.help{font-size:12px;color:var(--sub);margin:8px 2px 0;line-height:1.5}
.url{word-break:break-all;background:var(--fill);border-radius:10px;padding:10px;font-size:12px;margin:8px 0}
ol.steps{padding-left:20px;font-size:14px;line-height:1.7}
.box ol.steps li{list-style:decimal;margin:4px 0}
</style>
</head>
<body>
<header><h1>청약핑</h1><p id="sub"></p></header>
<main id="view"></main>
<nav id="tabs"></nav>
<div class="sheet" id="sheet"><div class="bg" data-close></div><div class="panel" id="panel"></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = {announcement:"#8e8e93", special:"#7d57ed", first:"#2461f5", second:"#14a3a3", winner:"#f59a1f", contract:"#1aa36e"};
const ORDER = ["announcement","special","first","second","winner","contract"];
const APPLY = ["special","first","second"];
const WD = ["일","월","화","수","목","금","토"];

let DATA = {listings:[], kinds:{}, sample:true};
let tab = "home", region = "전체", persona = "전체", moreTab = "guide", onlyOk = false;
let me = {months:null, homeless:null, dep:0};
try { Object.assign(me, JSON.parse(localStorage.getItem("me") || "{}")); } catch (e) {}
const saveMe = () => { try { localStorage.setItem("me", JSON.stringify(me)); } catch (e) {} };
try { const p = localStorage.getItem("persona"); if (["전체","싱글","신혼부부"].includes(p)) persona = p; } catch (e) {}
let added = new Set();
try { added = new Set(JSON.parse(localStorage.getItem("added") || "[]")); } catch (e) {}
const saveAdded = () => { try { localStorage.setItem("added", JSON.stringify([...added])); } catch (e) {} };

/* ---------- 날짜 (KST 기준, 'YYYY-MM-DD' 문자열 ↔ 일수) ---------- */
const dn = s => { const [y,m,d] = s.split("-").map(Number); return Math.round(Date.UTC(y, m-1, d) / 86400000); };
const ds = n => new Date(n * 86400000).toISOString().slice(0, 10);
const todayStr = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const TODAY = () => dn(todayStr());
const md = n => { const t = new Date(n * 86400000); return `${t.getUTCMonth()+1}.${t.getUTCDate()}`; };
const mdw = n => `${md(n)} (${WD[new Date(n * 86400000).getUTCDay()]})`;
const range = e => dn(e.end) > dn(e.start) ? `${md(dn(e.start))} ~ ${mdw(dn(e.end))}` : mdw(dn(e.start));

/* ---------- 상태 계산 (앱의 Listing.status 와 동일 규칙) ---------- */
function statusOf(l) {
  const t = TODAY();
  const ap = l.events.filter(e => APPLY.includes(e.kind));
  if (ap.length) {
    const s = Math.min(...ap.map(e => dn(e.start))), en = Math.max(...ap.map(e => dn(e.end)));
    if (t < s) {
      const first = ap.slice().sort((a, b) => dn(a.start) - dn(b.start))[0];
      return {phase:"upcoming", badge:`D-${s - t}`, head:`${DATA.kinds[first.kind].short} 접수 시작`, urgent:false, sort:s};
    }
    if (t <= en) {
      const act = ap.filter(e => dn(e.start) <= t && t <= dn(e.end));
      if (act.length) {
        const left = Math.min(...act.map(e => dn(e.end) - t));
        const names = act.sort((a, b) => ORDER.indexOf(a.kind) - ORDER.indexOf(b.kind)).map(e => DATA.kinds[e.kind].short).join("·");
        return {phase:"open", badge: left === 0 ? "오늘 마감" : `D-${left} 마감`, head:`${names} 접수 중`, urgent:left <= 1, sort:t + left};
      }
      const next = ap.filter(e => dn(e.start) > t).sort((a, b) => dn(a.start) - dn(b.start))[0];
      if (next) return {phase:"open", badge:`D-${dn(next.start) - t}`, head:`다음 ${DATA.kinds[next.kind].short} 접수까지`, urgent:false, sort:dn(next.start)};
    }
  }
  const w = l.events.find(e => e.kind === "winner");
  if (w && dn(w.start) >= t) {
    const n = dn(w.start) - t;
    return {phase:"wait", badge: n === 0 ? "오늘 발표" : `발표 D-${n}`, head:"당첨자 발표 대기", urgent:n === 0, sort:dn(w.start)};
  }
  const c = l.events.find(e => e.kind === "contract");
  if (c && dn(c.end) >= t) return {phase:"wait", badge: dn(c.start) <= t ? "계약 중" : "계약 예정", head:"계약 일정", urgent:false, sort:dn(c.start)};
  return {phase:"done", badge:"종료", head:"청약 일정 종료", urgent:false, sort:t};
}
const visible = () => DATA.listings.filter(l => region === "전체" || l.region === region);

/* ---------- 내 청약통장 · 가점 (참고용 추정) ----------
   기준: 민영 일반공급 1순위 가입기간 — 규제지역(투기과열·조정대상) 24개월, 그 외 수도권 12개월.
   예치금·납입횟수·세대주·무주택 요건은 반영하지 않아요. */
const hasBank = () => me.months != null && !isNaN(me.months);
const scoreBank = m => m < 6 ? 1 : m < 12 ? 2 : Math.min(17, 2 + Math.floor(m / 12));
const scoreHome = h => h === "u30" ? 0 : (h == null || h === "") ? null : Math.min(32, 2 * (Math.floor(Number(h)) + 1));
const scoreDep = n => Math.min(35, 5 + 5 * Math.max(0, Number(n) || 0));
function myScore() {
  const b = hasBank() ? scoreBank(me.months) : null, h = scoreHome(me.homeless), d = scoreDep(me.dep);
  return {b, h, d, total: (b || 0) + (h || 0) + d, complete: b != null && h != null};
}
function zone(l) {
  const r = l.reg || {};
  if (r.spec === true) return "spec";
  if (r.adj === true) return "adj";
  if (r.spec === false && r.adj === false) return "none";
  return "unk";
}
function bankFit(l) {
  if (!hasBank()) return null;
  const m = me.months, z = zone(l), need = (z === "spec" || z === "adj") ? 24 : z === "none" ? 12 : null;
  const pub = l.kind === "국민" ? " · 납입 횟수도 필요" : "";
  if (need != null) {
    if (m >= need) return {level:"ok", cls:"ok", text:`✅ 1순위 가입기간 충족 (${need}개월)${pub}`};
    if (m >= 6) return {level:"special", cls:"warn", text:`🟡 일반 1순위는 ${need}개월 필요 · 특공 가능성`};
    return {level:"low", cls:"bad", text:"⛔ 가입 6개월 미만"};
  }
  if (m >= 24) return {level:"ok", cls:"ok", text:`✅ 1순위 가입기간 충족${pub}`};
  if (m >= 12) return {level:"maybe", cls:"warn", text:"🟡 규제지역이면 24개월 필요 (공고 확인)"};
  if (m >= 6) return {level:"special", cls:"warn", text:"🟡 일반 1순위는 12개월 이상 필요"};
  return {level:"low", cls:"bad", text:"⛔ 가입 6개월 미만"};
}
/* 주택형별 추첨제 비중(대략) — 규제지역: 60㎡↓ 60% · 60~85㎡ 30% · 85㎡↑ 20%(투기과열)/50%(조정) / 비규제: 85㎡↓ 60% · 85㎡↑ 100% */
function lotShare(l, t) {
  if (l.kind === "국민" || t.area == null) return null;
  const z = zone(l);
  if (z === "unk") return null;
  if (z === "none") return t.area <= 85 ? 60 : 100;
  return t.area <= 60 ? 60 : t.area <= 85 ? 30 : (z === "spec" ? 20 : 50);
}
const bestLot = l => Math.max(0, ...(l.types || []).map(t => lotShare(l, t) || 0));

/* ---------- 싱글 / 신혼부부 : 가능성 있는 공급 유형 ----------
   ※ 참고용 분류예요. 소득·자산·무주택·통장 요건은 반영하지 않아요. 최종 확인은 공고문에서! */
const SUPPLY_LABEL = {newlywed:"신혼부부", first_home:"생애최초", multi_child:"다자녀", parents:"노부모부양", institution:"기관추천", newborn:"신생아", youth:"청년", etc:"기타"};
const sumBy = (l, key, cond) => (l.types || []).filter(cond || (() => true)).reduce((a, t) => a + (t[key] || 0), 0);
const small = t => t.area != null && t.area <= 60;
function fit(l, p) {
  if (!l.supply || !l.types || !l.types.length) return {unknown:true, items:[]};
  const S = l.supply, items = [];
  if (p === "신혼부부") {
    if (S.newlywed) items.push({k:"newlywed", n:S.newlywed, text:"신혼부부 특별공급", note:"혼인 7년 이내(공공분양은 예비신혼·한부모 포함)"});
    if (S.first_home) items.push({k:"first_home", n:S.first_home, text:"생애최초 특별공급", note:"세대 전원 무주택 · 5년 소득세 납부 등"});
    if (S.newborn) items.push({k:"newborn", n:S.newborn, text:"신생아 특별공급", note:"2년 내 출산 · 공공분양 중심"});
  } else if (p === "싱글") {
    const fh = sumBy(l, "first_home", small);
    if (fh) items.push({k:"first_home", n:fh, text:"생애최초 특공(추첨)", note:"1인 가구는 추첨 물량 · 전용 60㎡ 이하 주택형만 (부모와 같은 등본이면 전 주택형)"});
    if (S.youth) items.push({k:"youth", n:S.youth, text:"청년 특별공급", note:"만 19~39세 미혼 · 공공 · 주로 소형"});
  }
  return {unknown:false, items};
}
const hasGeneral = l => !l.supply ? true : (l.supply.general || 0) > 0 || !(l.types || []).length;
const personaCards = () => persona !== "전체";

/* ---------- 화면 조각 ---------- */
function mini(l) {
  let ev = l.events.filter(e => ["special","first","winner"].includes(e.kind));
  if (!ev.length) ev = l.events.filter(e => e.kind !== "announcement");
  return `<div class="mini">${ev.slice(0, 3).map(e => {
    const past = dn(e.end) < TODAY();
    return `<div><small><i style="background:${COLORS[e.kind]}"></i>${DATA.kinds[e.kind].short}</small><b class="${past ? "past" : ""}">${md(dn(e.start))}</b></div>`;
  }).join("")}</div>`;
}
function card(l) {
  const s = statusOf(l);
  const cls = s.phase === "open" ? (s.urgent ? "open urgent" : "open") : s.phase;
  const headCls = s.phase === "open" && s.urgent ? "urgent" : s.phase;
  return `<article class="card" data-id="${esc(l.id)}">
    <div class="row"><span class="pill r-${esc(l.region)}">${esc(l.region)}</span><span class="badge ${cls}">${esc(s.badge)}</span></div>
    <h3>${esc(l.name)}</h3><p class="addr">${esc(l.address)}</p>
    <p class="head ${headCls}">${esc(s.head)}</p>${mini(l)}${tagsHtml(l)}
    <div class="foot"><span>${l.units ? "🏢 " + l.units + "세대" : ""}</span>${added.has(l.id) ? '<span class="added">🔔 알림 추가됨</span>' : ""}</div>
  </article>`;
}
function tagsHtml(l) {
  let out = "";
  if (personaCards()) {
    const f = fit(l, persona);
    if (f.unknown) out += `<span class="tag2 gray">유형 정보 확인 필요</span>`;
    else if (!f.items.length) out += `<span class="tag2 gray">${persona} 특공 없음 · 일반공급만</span>`;
    else out += f.items.map(i => `<span class="tag2">${i.text.replace(" 특별공급","").replace("(추첨)","")} ${i.n}세대</span>`).join("");
  }
  const b = bankFit(l);
  if (b) out += `<span class="tag2 ${b.cls}">${b.text}</span>`;
  if (b && bestLot(l) >= 60) out += `<span class="tag2 gray">추첨제 비중 높음</span>`;
  return out ? `<div class="tags">${out}</div>` : "";
}
const whoChips = () => `<div class="chips who"><span class="lbl">나는</span>${["전체","싱글","신혼부부"].map(r => `<button class="chip ${r === persona ? "on" : ""}" data-persona="${r}">${r}</button>`).join("")}</div>`;
const chips = () => `<div class="chips">${["전체","서울","경기"].map(r => `<button class="chip ${r === region ? "on" : ""}" data-region="${r}">${r}</button>`).join("")}</div>`;
const sampleBanner = () => DATA.sample ? `<div class="banner violet"><span>🪄</span><span>지금은 <b>샘플 데이터</b>예요. GitHub에 청약홈 인증키를 등록하면 실제 공고로 바뀌어요.</span></div>` : "";

/* ---------- 홈 ---------- */
function viewHome() {
  const all = visible().map(l => ({l, s: statusOf(l), f: personaCards() ? fit(l, persona) : null, b: bankFit(l)}))
    .filter(x => !(onlyOk && hasBank()) || (x.b && (x.b.level === "ok" || x.b.level === "maybe")));
  const L = all.filter(x => !x.f || x.f.unknown || x.f.items.length);          // 내 특공 대상 + 확인 필요
  const rest = all.filter(x => x.f && !x.f.unknown && !x.f.items.length && x.s.phase !== "done"); // 일반공급만 가능
  const by = p => L.filter(x => x.s.phase === p).sort((a, b) => a.s.sort - b.s.sort);
  const open = by("open"), up = by("upcoming"), wait = by("wait");

  const sec = (t, a) => a.length ? `<section><h2>${t}<span class="count">${a.length}</span></h2>${a.map(x => card(x.l)).join("")}</section>` : "";

    <p class="help" style="margin:-4px 0 10px">${persona} 대상 특별공급이 없는 단지예요. 일반공급(가점제·추첨제)으로는 신청할 수 있어요.</p>
    ${rest.sort((a, b) => a.s.sort - b.s.sort).map(x => card(x.l)).join("")}</section>` : "";

  const bankBar = hasBank()

    : `<div class="banner blue" data-goto="me" style="cursor:pointer"><span>🏦</span><span>내 <b>청약통장 가입기간</b>을 입력하면 단지마다 1순위 가능 여부를 보여줘요. <b>입력하러 가기 ›</b></span></div>`;
  return sampleBanner() + chips() + whoChips() + bankBar + whoNote +
    `<div class="tiles">
      <div class="tile"><b style="color:var(--success)">${open.length}</b><span>접수 중</span></div>
      <div class="tile"><b style="color:var(--primary)">${soon}</b><span>7일 내 시작</span></div>
      <div class="tile"><b style="color:var(--violet)">${added.size}</b><span>알림 추가</span></div></div>` +

    (personaCards() && !(open.length + up.length + wait.length) ? `<div class="empty">${persona} 대상 특별공급 단지가 아직 없어요</div>` : "") +
    restHtml +

/* ---------- 캘린더 ---------- */
let cur = (() => { const t = new Date(Date.now() + 9 * 3600e3); return {y: t.getUTCFullYear(), m: t.getUTCMonth()}; })();
let sel = todayStr();
function itemsOn(n) {
  return visible().flatMap(l => l.events.filter(e => e.kind !== "announcement" && dn(e.start) <= n && n <= dn(e.end)).map(e => ({l, e})))
    .sort((a, b) => ORDER.indexOf(a.e.kind) - ORDER.indexOf(b.e.kind));
}
function viewCalendar() {
  const first = new Date(Date.UTC(cur.y, cur.m, 1)), lead = first.getUTCDay();
  const days = new Date(Date.UTC(cur.y, cur.m + 1, 0)).getUTCDate();

    <div class="grid">${cells}</div>
    <div class="legend">${["special","first","second","winner","contract"].map(k => `<span><i style="background:${COLORS[k]}"></i>${DATA.kinds[k].short}</span>`).join("")}</div></div>
    <section><h2>${mdw(sn)}${list.length ? `<span class="count">${list.length}</span>` : ""}</h2>
    ${list.length ? list.map(x => `<div class="item" data-id="${esc(x.l.id)}"><div class="ico" style="background:${COLORS[x.e.kind]}">${DATA.kinds[x.e.kind].short}</div>
      <div><small style="color:${COLORS[x.e.kind]};font-weight:700">${DATA.kinds[x.e.kind].title}</small><b>${esc(x.l.name)}</b><small>${esc(x.l.region)} · ${range(x.e)}</small></div></div>`).join("")
      : '<div class="empty" style="padding:24px 0">이 날은 예정된 청약 일정이 없어요</div>'}</section>`;
}

/* ---------- 상세 시트 ---------- */
function bankSection(l) {
  if (!hasBank()) return `<div class="fit no"><b>내 통장 기준</b>“내 조건” 탭에서 가입기간을 입력하면 이 단지의 1순위 가능 여부를 알려줘요.</div>`;
  const b = bankFit(l), z = zone(l), sc = myScore();
  const zt = {spec:"투기과열지구", adj:"조정대상(청약과열)지역", none:"비규제지역", unk:"규제지역 여부 확인 필요"}[z];
  const rows = (l.types || []).map(t => {
    const lot = lotShare(l, t);
    return `<tr><td>${t.area != null ? t.area + "㎡" : esc(t.ty)}</td><td>${lot == null ? "-" : (100 - lot) + "%"}</td><td>${lot == null ? "-" : lot + "%"}</td></tr>`;
  }).join("");
  const lotTable = rows && l.kind !== "국민" && z !== "unk"
    ? `<table class="tbl2"><tr><th>주택형</th><th>가점제</th><th>추첨제</th></tr>${rows}</table><p class="help">일반공급 물량 기준 대략적인 비율이에요. 정확한 배정은 공고문에서 확인하세요.</p>` : "";
  return `<div class="fit ${b.cls === "ok" ? "" : "no"}"><b>내 통장(${Math.floor(me.months / 12)}년 ${me.months % 12}개월) 기준</b>${b.text}<br>
    <span style="color:var(--sub);font-size:12.5px">${zt}${l.kind ? " · " + l.kind + "주택" : ""} · 예치금·세대주·무주택 요건은 따로 확인해야 해요.${sc.complete ? ` 내 가점 약 ${sc.total}점.` : ""}</span></div>${lotTable}`;
}
function supplySection(l) {
  const who = persona === "전체" ? ["싱글", "신혼부부"] : [persona];
  const boxes = who.map(p => {
    const f = fit(l, p);
    if (f.unknown) return `<div class="fit no"><b>${p}</b>주택형별 공급 정보를 아직 못 받았어요. 공고문에서 확인해 주세요.</div>`;
    if (!f.items.length) return `<div class="fit no"><b>${p}</b>${p} 대상 특별공급은 없어 보여요. 일반공급(가점제·추첨제)으로 신청할 수 있어요.</div>`;
    return `<div class="fit"><b>${p} · 가능성 있는 특별공급</b>${f.items.map(i => `· ${i.text} ${i.n}세대<br><span style="color:var(--sub);font-size:12.5px;margin-left:10px">${i.note}</span>`).join("<br>")}</div>`;
  }).join("");
  const cols = [["general","일반"],["newlywed","신혼"],["first_home","생애최초"],["multi_child","다자녀"],["parents","노부모"],["institution","기관추천"],["newborn","신생아"],["youth","청년"]]
    .filter(c => (l.types || []).some(t => t[c[0]]));
  const table = l.types && l.types.length ? `<div class="tbl"><table><tr><th>주택형</th>${cols.map(c => `<th>${c[1]}</th>`).join("")}</tr>
    ${l.types.map(t => `<tr><td>${esc(t.area != null ? t.area + "㎡" : t.ty)}${t.price ? `<br><span style="color:var(--sub)">${Math.round(t.price / 100) / 100}억↑</span>` : ""}</td>${cols.map(c => `<td class="${t[c[0]] ? "" : "z"}">${t[c[0]] || "-"}</td>`).join("")}</tr>`).join("")}</table></div>` : "";
  return `<div class="tl"><h2 style="margin-top:0">공급 유형</h2>${boxes}${table ? '<div class="sub-h">주택형별 공급 세대수</div>' + table : ""}
    <p class="help">참고용 분류예요. 소득·자산·무주택·청약통장 요건은 반영하지 않았어요. 자격은 꼭 입주자 모집공고문에서 확인하세요.</p></div>`;
}
function openDetail(id) {
  const l = DATA.listings.find(x => x.id === id); if (!l) return;
  const s = statusOf(l), t = TODAY();
  const rows = [["총 공급세대", l.units ? l.units + "세대" : ""], ["입주 예정", l.move_in && l.move_in.length >= 6 ? l.move_in.slice(0,4) + "." + l.move_in.slice(4,6) : ""],
                ["시공사", l.builder], ["시행사", l.developer], ["분양 문의", l.phone]].filter(r => r[1]);
  const tl = l.events.map((e, i) => {
    const past = dn(e.end) < t, ong = dn(e.start) <= t && t <= dn(e.end), last = i === l.events.length - 1;
    return `<div class="ev"><div class="rail"><div class="dot" style="background:${past ? "#b9b9c0" : COLORS[e.kind]}">${past ? "✓" : DATA.kinds[e.kind].short.slice(0, 2)}</div>${last ? "" : '<div class="line"></div>'}</div>
      <div class="txt"><b style="${past ? "color:var(--sub)" : ""}">${DATA.kinds[e.kind].title}</b>${ong ? '<span class="tag">진행 중</span>' : ""}
      <div class="d" style="color:${past ? "var(--sub)" : COLORS[e.kind]}">${range(e)}</div><p>${DATA.kinds[e.kind].hint}</p></div></div>`;
  }).join("");
  const supplyHtml = bankSection(l) + supplySection(l);
  const noticeUrl = l.url && /^https?:\/\//.test(l.url) ? l.url : "https://www.applyhome.co.kr";
  $("#panel").innerHTML = `<button class="close" data-close aria-label="닫기">✕</button>
    <span class="pill r-${esc(l.region)}">${esc(l.region)}</span>
    <h2>${esc(l.name)}</h2><div class="addr" style="white-space:normal">📍 ${esc(l.address)}</div>
    <p class="head ${s.phase === "open" && s.urgent ? "urgent" : s.phase}" style="margin-top:10px"><span class="badge ${s.phase === "open" ? "open" : s.phase} ${s.urgent ? "urgent" : ""}" style="margin-right:6px">${esc(s.badge)}</span>${esc(s.head)}</p>
    <a class="btn primary" data-add="${esc(l.id)}" href="ics/${encodeURIComponent(l.id)}.ics">📅 알림 포함해서 캘린더에 추가</a>
    <p class="help">누르면 “모두 추가” 화면이 떠요. 일정이 바뀌면 다시 추가해 주세요.</p>
    ${supplyHtml}
    <div class="tl"><h2 style="margin-top:0">청약 일정</h2>${tl}</div>
    ${rows.length ? `<div class="info"><h2 style="margin:0 0 6px">단지 정보</h2>${rows.map(r => `<div><span>${r[0]}</span><b style="font-weight:600">${esc(r[1])}</b></div>`).join("")}</div>` : ""}
    <a class="btn soft" href="${esc(noticeUrl)}" target="_blank" rel="noopener">청약홈에서 공고문 보기 ↗</a>
    ${l.phone ? `<a class="btn gray" href="tel:${esc(l.phone.replace(/[^\d+]/g, ""))}">분양 문의 전화</a>` : ""}
    <p class="note">일정과 정보는 참고용이에요. 신청 전 반드시 입주자 모집공고문에서 자격과 일정을 다시 확인하세요.</p>`;
  $("#sheet").classList.add("open");
}

ICON.me = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>';
ICON.tip = '<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>';
const TABS = [["home","홈",ICON.home],["cal","캘린더",ICON.cal],["me","내 조건",ICON.me],["tips","유리한 조건",ICON.tip],["more","더보기",ICON.book]];
function render() {
  $("#tabs").innerHTML = TABS.map(t => `<button class="${t[0] === tab ? "on" : ""}" data-tab="${t[0]}">${t[2]}${t[1]}</button>`).join("");
  $("#view").innerHTML = ({home:viewHome, cal:viewCalendar, me:viewMe, tips:viewTips, more:viewMore}[tab])();
  const upd = DATA.updated ? DATA.updated.slice(5, 16).replace("T", " ") : "";
  $("#sub").textContent = `서울·경기 청약 일정${upd ? " · 업데이트 " + upd : ""}`;
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tab],[data-region],[data-persona],[data-more],[data-only],[data-goto],[data-day],[data-mv],[data-id],[data-close],[data-add],[data-copy]");
  if (!t) return;
  const d = t.dataset;
  if (d.add) { added.add(d.add); saveAdded(); setTimeout(render, 300); return; }        // 링크는 그대로 열리게 둠
  if (d.close !== undefined) { closeSheet(); return; }
  if (d.goto) { tab = d.goto; if (d.only) onlyOk = true; window.scrollTo(0, 0); }
  else if (d.only) { onlyOk = !onlyOk; }
  else if (d.more) { moreTab = d.more; window.scrollTo(0, 0); }
  else if (d.tab) { tab = d.tab; window.scrollTo(0, 0); }
  else if (d.region) region = d.region;
  else if (d.persona) { persona = d.persona; try { localStorage.setItem("persona", persona); } catch (e) {} }
  else if (d.day) sel = d.day;
  else if (d.mv !== undefined) {
    const m = Number(d.mv);
    if (m === 0) { const n = new Date(Date.now() + 9 * 3600e3); cur = {y:n.getUTCFullYear(), m:n.getUTCMonth()}; sel = todayStr(); }
    else { const n = new Date(Date.UTC(cur.y, cur.m + m, 1)); cur = {y:n.getUTCFullYear(), m:n.getUTCMonth()}; }
  }
  else if (d.copy !== undefined) {
    const text = $("#icsurl").textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { t.textContent = "복사했어요 ✓"; }).catch(() => { t.textContent = "주소를 길게 눌러 복사해 주세요"; });
    return;
  }
  else if (d.id) { openDetail(d.id); return; }
  render();
});

document.addEventListener("change", ev => {
  const t = ev.target.closest("[data-me]"); if (!t) return;
  const k = t.dataset.me, v = t.value;
  if (k === "years" || k === "months") {
    const root = t.closest(".pair"), yv = root.querySelector('[data-me=years]').value, mv = root.querySelector('[data-me=months]').value;
    me.months = (yv === "" && mv === "") ? null : Math.max(0, (Number(yv) || 0) * 12 + (Number(mv) || 0));
  } else if (k === "homeless") me.homeless = v === "" ? null : v === "u30" ? "u30" : Number(v);
  else if (k === "dep") me.dep = Number(v);
  saveMe();
  if (tab === "me" && $("#meRes")) $("#meRes").innerHTML = meResult(); else render();
});

fetch("listings.json?v=" + Date.now()).then(r => r.json()).then(j => { DATA = j; render(); })
  .catch(() => { $("#view").innerHTML = '<div class="empty">데이터를 불러오지 못했어요.<br>build.py를 먼저 실행해 주세요.</div>'; });
render();
</script>
</body>
</html>
